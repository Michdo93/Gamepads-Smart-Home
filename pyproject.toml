[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gamepadsmarthome"
version = "1.0.0"
description = "Begleitbibliothek zum Buch: Smart Home & Gamepads – mit Python 3, openHAB, MQTT und REST"
authors = [{ name = "Michael Christian Dörflinger" }]
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0", "paho-mqtt>=2.0", "aiohttp>=3.9"]

[project.optional-dependencies]
linux = ["evdev>=1.6"]
pygame = ["pygame>=2.5"]

[tool.setuptools]
packages = ["gamepadsmarthome", "gamepadsmarthome.backends"]

[tool.setuptools.package-data]
gamepadsmarthome = ["mappings/*.yaml"]
